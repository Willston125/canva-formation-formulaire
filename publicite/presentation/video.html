<title>IMPACTALI — Présentation vidéo</title>
<!--
  La vidéo de présentation d'IMPACTALI, image par image.

  CHAQUE IMAGE EST CALCULÉE, PAS JOUÉE : `rendre(t)` pose tout ce qui est à
  l'écran à l'instant t. Le tournage (rendre.js) filme ainsi à cadence
  parfaite, et deux rendus donnent la même vidéo.

  Adresse :  video.html?format=9x16|4x5&montage=40|15[&st=1]
    format    9x16 (1080 × 1920, Reels / TikTok / Shorts / Stories) ou 4x5 (1080 × 1350, fil d'actualité)
    montage   40 (version principale) ou 15 (version courte)
    st=1      affiche les sous-titres incrustés par-dessus
  Ouverte dans un navigateur à travers un serveur local, la page joue en
  boucle avec une barre de lecture (voir LISEZMOI.md).

  Les textes se modifient dans donnees.js, pas ici.
-->

  /* La charte du site (style.css, :root) */

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  body.calque-st, body.calque-st #scene { background: transparent !important; }
  body { overflow: hidden; }

  #cadre { position: relative; transform-origin: 0 0; }
  #scene {

  .lueur { position: absolute; border-radius: 50%; left: 0; top: 0; }

  .creer-rail { border-radius: 16px; background: #0D1723; border: 1px solid rgba(255, 255, 255, .06); }

  .ia-barre { background: #ECEAE3; }

  /* ---------- 4. La pratique ---------- */
