<style>
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 300 800; src: url(../../assets/fonts/plus-jakarta-sans-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  @font-face { font-family: 'Inter'; font-weight: 300 800; src: url(../../assets/fonts/inter-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+A720-A7FF; }
  @font-face { font-family: 'Material Symbols Outlined'; font-weight: 400 700; font-display: block; src: url(../../assets/fonts/material-symbols-outlined.woff2) format('woff2'); }

  :root {

  .halos .h2 { width: 1400px; height: 1400px; left: -720px; bottom: -720px; background: radial-gradient(circle, rgba(46,92,255,.18) 0%, rgba(46,92,255,.05) 38%, rgba(46,92,255,0) 66%); }
  .grille { inset: 0; pointer-events: none; background-size: 60px 60px;

  .carte-noire ul { list-style: none; display: grid; gap: 12px; }

  .pilule-noire { display: inline-flex; align-items: center; gap: 12px; padding: 18px 26px; border-radius: 999px; background: var(--nuit); color: var(--blanc);

  /* ---- Vitrines ---- */
  .carte { border-radius: 26px; background: linear-gradient(160deg, #131D2A, #0A1119); border: 1px solid rgba(255,255,255,.10); box-shadow: 0 34px 80px rgba(0,0,0,.5); overflow: hidden; }
  .carte > *, .mock > * { position: absolute; }

  .pastille-label { display: inline-flex; padding: 9px 16px; border-radius: 999px; background: var(--vert); color: var(--nuit); font: 800 16px/1 var(--corps); letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .barre { display: block; height: 14px; border-radius: 7px; background: rgba(255,255,255,.18); }

<body>
<div id="scene"></div>
<script src="donnees.js"></script>
<script>
'use strict';
const { MARCHES, FORMATIONS } = window.CAMPAGNE;
const params = new URLSearchParams(location.search);
const SLUG = params.get('f') || 'canva-pro';
const VID = params.get('v') || 'annonce';
const MARCHE = params.get('m') || null;
const PHOTO_L = 1122, PHOTO_H = 1402;

// ------------------------------------------------------------ dates ----
const JL = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MO = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MC = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const lireDate = iso => { const [a, m, j] = iso.split('-').map(Number); return { a, m: m - 1, j, js: new Date(Date.UTC(a, m - 1, j)).getUTCDay() }; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const jourNum = d => d.j === 1 ? '1er' : String(d.j);
const jourLong = iso => { const d = lireDate(iso); return `${JL[d.js]} ${jourNum(d)} ${MO[d.m]}`; };
const plage = (a, b) => {
  const A = lireDate(a), B = lireDate(b), c = d => JL[d.js].slice(0, 3);
  return A.m === B.m
    ? [`${cap(c(A))} ${jourNum(A)} au ${c(B)} ${jourNum(B)}`, `${MO[A.m]} ${A.a}`]
    : [`${cap(c(A))} ${jourNum(A)} ${MC[A.m]}`, `au ${c(B)} ${jourNum(B)} ${MC[B.m]}`];
};
const nombre = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

// ------------------------------------------------------------ pièces ----
const ms = n => `<span class="ms">${n}</span>`;
const halos = () => '<div class="halos"><i class="h1"></i><i class="h2"></i></div>';
const grille = (sombre = false) => `<div class="grille${sombre ? ' sombre' : ''}"></div>`;
const grain = () => '<div class="grain"></div>';
const lignesTitre = (lignes, vertes = []) => lignes.map((l, i) => (vertes.includes(i) ? `<span class="v">${l}</span>` : l)).join('<br>');

/* L'anneau : le « C » ouvert du logo IMPACTALI et son point, en grand. */
function anneau({ cx, cy, d, ep = 2, op = .6, rot = -30, point = 12, couleur = '#CBFD00' }) {
  const r = d / 2 - ep - point;
  const c = 2 * Math.PI * r;
  const trou = c * 0.12;
  const a = -0.06 * 2 * Math.PI; // le point, au milieu de l'ouverture
  const px = d / 2 + r * Math.cos(a), py = d / 2 + r * Math.sin(a);
  return `<svg class="anneau" width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" style="left:${cx - d / 2}px;top:${cy - d / 2}px;transform:rotate(${rot}deg);opacity:${op}">
    <circle cx="${d / 2}" cy="${d / 2}" r="${r}" fill="none" stroke="${couleur}" stroke-width="${ep}" stroke-linecap="round" stroke-dasharray="${c - trou} ${trou}"/>
    <circle cx="${px}" cy="${py}" r="${point}" fill="${couleur}"/></svg>`;
}

/* Cadrer la photo d'une formation dans une boîte : `foyer` (en pixels de la photo source)
   va se placer au point `cible` de la boîte (par défaut son centre), sans jamais montrer de vide. */
function cadrage(F, w, h, { foyer = 'visage', zoom = 1, cible = null } = {}) {
  const [fx, fy] = Array.isArray(foyer) ? foyer : F[foyer];
  const s = Math.max(w / PHOTO_L, h / PHOTO_H) * zoom;
  const W = PHOTO_L * s, H = PHOTO_H * s;
  const [tx, ty] = cible || [w / 2, h / 2];
  const x = Math.min(Math.max(fx * s - tx, 0), W - w);
  const y = Math.min(Math.max(fy * s - ty, 0), H - h);
  return `background-image:url(medias/${F.photo});background-size:${W.toFixed(1)}px ${H.toFixed(1)}px;background-position:${(-x).toFixed(1)}px ${(-y).toFixed(1)}px;`;
}
/* Où tombe le foyer une fois cadré (pour y centrer l'anneau). */
function foyerCadre(F, w, h, { foyer = 'visage', zoom = 1, cible = null } = {}) {
  const [fx, fy] = Array.isArray(foyer) ? foyer : F[foyer];
  const s = Math.max(w / PHOTO_L, h / PHOTO_H) * zoom;
  const W = PHOTO_L * s, H = PHOTO_H * s;
  const [tx, ty] = cible || [w / 2, h / 2];
  const x = Math.min(Math.max(fx * s - tx, 0), W - w);
  const y = Math.min(Math.max(fy * s - ty, 0), H - h);
  return [fx * s - x, fy * s - y];
}

const cadreHaut = (F, num, clair = false) => `
  <header class="cadre-haut t${clair ? ' clair' : ''}">
    <img class="logo" src="../medias/logo-${clair ? 'noir' : 'vert'}.png" alt="">
    <p class="serie"><span>${F.court}</span><b>${num}</b></p>
  </header>`;
const cadreBas = (gauche, droite) => `<div class="cadre-bas t"><span>${gauche}</span><span>${droite}</span></div>`;
const site = '<span class="site">impactali.site</span>';
const cta = (F, S) => `Écrivez « ${F.motCle} » au <b>${S.wa}</b>`;
const prix = (S, style) => `<div class="prix t" style="${style}"><b>${nombre(S.prix)}</b><span>${S.devise}</span><small>${S.total} places</small></div>`;
function ticket(M, S, style, vertical = false) {
  const [d1, d2] = plage(S.debut, S.fin);
  return `<div class="ticket verre t${vertical ? ' vertical' : ''}" style="${style}">
    <div><span>Dates</span><b>${d1}<br><em>${d2}</em></b></div>
    <div><span>Horaires</span><b>18h30 – 20h30<br><em>6 soirées · 12 heures</em></b></div>
    <div><span>${M.lieuLibelle}</span><b>${M.lieu}</b></div>
  </div>`;
}
const progression = (actif, total, style = 'right:72px;bottom:66px') =>
  `<div class="progression t" style="${style}">${Array.from({ length: total }, (_, i) => `<i${i === actif ? ' class="on"' : ''}></i>`).join('')}</div>`;

/* Réglages d'art par formation : où placer le visage dans l'annonce, taille du titre. */
const ART = {
  'canva-pro': { zoom: 1.15, cible: [805, 410], titre: 100 },
  'identite-visuelle': { zoom: 1.15, cible: [805, 410], titre: 100 },
  'marketing-digital': { zoom: 1.12, cible: [800, 470], titre: 112 },
  'ia-appliquee': { zoom: 1.15, cible: [810, 450], titre: 100 },
  'photo-video': { zoom: 1.25, cible: [860, 330], titre: 86 }
};

// ------------------------------------------------------------ maquettes ----
const V = {};

function typographie(racine) {
  const marcheur = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);
  const noeuds = [];
  while (marcheur.nextNode()) noeuds.push(marcheur.currentNode);
  noeuds.forEach(n => {
    if (n.parentElement && n.parentElement.closest('svg, .ms')) return;
    n.nodeValue = n.nodeValue
      .replace(/ ([?!:;»%])/g, ' $1')
      .replace(/« /g, '« ')
      .replace(/(\d) – (\d)/g, '$1 – $2')
      .replace(/(\d) (soirées?|places?|heures|h\b|modules?|questions|réponses|séances|projet)/g, '$1 $2')
      .replace(/(\+\d{3})((?: \d{2,3})+)/g, (m, a, b) => a + b.replace(/ /g, ' '));
  });
}

  }
  let M = null, S = null;
  if (def.marche) {

    M = MARCHES[MARCHE];
    const L = live[MARCHE];
    const s = L && L.sessions[SLUG];
    if (!M || !s) throw new Error(`Pas de session ${SLUG} pour ${MARCHE} dans _live.json`);
    S = Object.assign({ wa: L.wa, devise: L.devise }, s);
  }
  const [w, h] = def.taille;
  document.body.style.width = w + 'px';
  document.body.style.height = h + 'px';
  scene.style.width = w + 'px';
  scene.style.height = h + 'px';
  scene.innerHTML = def.html(F, M, S);
  typographie(scene);
  window.MAQUETTE = { formation: SLUG, maquette: VID, marche: MARCHE, w, h };

    document.fonts.load('48px "Material Symbols Outlined"', 'check_circle arrow_forward')
  ]).catch(() => null);
  /* Les images de fond (background-image) doivent être chargées avant la capture. */
  const urls = new Set();
  scene.querySelectorAll('*').forEach(e => { const m = /url\("?([^")]+)"?\)/.exec(getComputedStyle(e).backgroundImage); if (m && !m[1].startsWith('data:')) urls.add(m[1]); });
  scene.querySelectorAll('img').forEach(i => urls.add(i.src));
  window.IMAGES_MANQUANTES = [];
  await Promise.all([...urls].map(u => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = () => { window.IMAGES_MANQUANTES.push(u); r(); }; i.src = u; })));
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
})();

  const r0 = scene.getBoundingClientRect();
  const largeurTexte = e => { const r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width; };
  const icones = [...scene.querySelectorAll('.ms')].filter(e => largeurTexte(e) > parseFloat(getComputedStyle(e).fontSize) * 1.5).map(e => e.textContent);
  const blocs = [...scene.querySelectorAll('.t')];
  const boites = blocs.map(e => ({ e, r: e.getBoundingClientRect() }));
  const nom = e => (e.className + ' « ' + e.textContent.trim().replace(/\s+/g, ' ').slice(0, 40) + ' »');
  const hors = boites.filter(({ r }) => r.left < r0.left - 2 || r.top < r0.top - 2 || r.right > r0.right + 2 || r.bottom > r0.bottom + 2).map(({ e }) => nom(e));
  const chevauchements = [];
  for (let i = 0; i < boites.length; i++) for (let j = i + 1; j < boites.length; j++) {
    const a = boites[i], b = boites[j];
    if (a.e.contains(b.e) || b.e.contains(a.e)) continue;
    const l = Math.max(a.r.left, b.r.left), t = Math.max(a.r.top, b.r.top), rr = Math.min(a.r.right, b.r.right), bb = Math.min(a.r.bottom, b.r.bottom);
    if (rr - l > 3 && bb - t > 3) chevauchements.push(nom(a.e) + ' × ' + nom(b.e));
  }
  const debordements = blocs.filter(e => e.scrollWidth > e.clientWidth + 2).map(nom);
  return { texte: scene.innerText, icones, hors, chevauchements, debordements, images: window.IMAGES_MANQUANTES || [] };
};
</script>
