<!DOCTYPE html>
<!-- L'aperçu des liens partagés (og:image), 1200 × 630, photographié par
     generer.js. Aucun pays, aucun prix, aucun numéro : la même image part sur
     toutes les pages et chez tous les visiteurs. Le fond est sombre : le logo y est
     dans sa version blanche, comme sur le site (décision du 28/10/2026). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 300 800; src: url(../../assets/fonts/plus-jakarta-sans-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 300 800; src: url(../../assets/fonts/inter-latin.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(560px circle at 600px 250px, rgba(110, 22, 21, 0.50), transparent 70%),
      radial-gradient(520px circle at 1120px 40px, rgba(208, 165, 67, 0.10), transparent 70%),
      #050709;
  }
  /* Le cadre fin, comme une carte de projection */
  body::after {
    content: ''; position: absolute; inset: 22px;
    border: 1px solid rgba(208, 165, 67, 0.28); border-radius: 18px;
  }
  img { width: 640px; height: auto; }
  .filet { width: 84px; height: 3px; margin: 44px 0 30px; background: #6E1615; box-shadow: 0 0 0 1px rgba(208, 165, 67, 0.35); }
  .devise { font: 600 40px/1.2 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; }
  .domaines { margin-top: 14px; color: #9CA6B2; font: 500 26px/1.3 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
  <img src="../../assets/brand/cineworld-logo-blanc.webp" alt="">
  <div class="filet"></div>
  <div class="devise">École de l’image</div>
  <div class="domaines">Vidéo · Design · Marketing digital · IA</div>
</body>
</html>
